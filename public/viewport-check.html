<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TokenHub 视口验收</title>
    <style>
      body {
        margin: 0;
        background: #e5e8ef;
        color: #162033;
        font: 14px system-ui;
      }
      header {
        padding: 18px 24px;
        background: white;
        border-bottom: 1px solid #ccd1de;
      }
      main {
        display: flex;
        align-items: flex-start;
        gap: 22px;
        padding: 22px;
        width: max-content;
      }
      section {
        width: 390px;
      }
      h2 {
        font-size: 14px;
        margin: 0 0 12px;
      }
      iframe {
        display: block;
        width: 390px;
        height: 844px;
        border: 1px solid #c1c8d7;
        border-radius: 12px;
        background: white;
      }
      p {
        font-size: 12px;
        color: #667085;
        margin: 5px 0 0;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>TokenHub 手机视口验收 · 390 × 844</strong>
      <p>
        每个 iframe 具有独立的 390px
        布局视口；可在内部操作导航、筛选、套餐与文档。
      </p>
    </header>
    <main>
      <section>
        <h2>首页</h2>
        <iframe title="手机首页" src="/"></iframe>
      </section>
      <section>
        <h2>模型市场</h2>
        <iframe title="手机模型市场" src="/models"></iframe>
      </section>
      <section>
        <h2>Token Plan</h2>
        <iframe title="手机套餐页" src="/pricing"></iframe>
      </section>
      <section>
        <h2>深层文档</h2>
        <iframe title="手机文档页" src="/docs/agent-guides/codex"></iframe>
      </section>
    </main>
    <script>
      const options = new URLSearchParams(location.search);
const width = options.get('width') === '1280' ? 1280 : 390;
const wanted = options.get('page');
const names = ['home','models','pricing','docs'];
document.querySelectorAll('main > section').forEach((section,index) => {
  if (wanted && names[index] !== wanted) { section.remove(); return; }
  section.style.width = width + 'px';
  section.querySelector('iframe').style.width = width + 'px';
});
document.querySelector('header strong').textContent = `TokenHub 视口验收 · ${width} × 844`;
for (const frame of document.querySelectorAll("iframe")) {
        const result = document.createElement("p");
        result.setAttribute("role", "status");
        frame.before(result);
        frame.addEventListener("load", () => {
          const check = () => {
            const doc = frame.contentDocument.documentElement;
            const overflow = doc.scrollWidth > doc.clientWidth;
            result.textContent = `${overflow ? "FAIL" : "PASS"} · 视口 ${doc.clientWidth}px / 内容 ${doc.scrollWidth}px`;
            result.style.color = overflow ? "#c93445" : "#16794b";
          };
          setTimeout(check, 1200);
          frame.contentWindow.addEventListener("resize", check);
          frame.contentWindow.addEventListener("error", () => {
            result.textContent = "FAIL · 页面发生运行错误";
            result.style.color = "#c93445";
          });
        });
      }
    </script>
  </body>
</html>
